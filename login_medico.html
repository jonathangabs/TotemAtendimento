
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap');

  .login-page {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    padding: 30px 15px;
  }

  .login-wrapper {
    width: 100%;
    max-width: 420px;
    animation: fadeInUp 0.6s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .login-card {
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.18);
    overflow: visible;
    background: #fff;
    position: relative;
  }

  .login-header {
    background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
    color: white;
    padding: 32px 25px 28px;
    text-align: center;
    border-radius: 20px 20px 0 0;
    position: relative;
    z-index: 1;
    animation: neonPulse 2.5s ease-in-out infinite;
  }

  @keyframes neonPulse {
    0%   { box-shadow: 0 0 8px 2px #3af0ff, 0 0 20px 6px #3af0ff88, 0 0 40px 10px #3af0ff33; }
    50%  { box-shadow: 0 0 16px 4px #a78bfa, 0 0 35px 12px #a78bfa88, 0 0 60px 18px #a78bfa33; }
    100% { box-shadow: 0 0 8px 2px #3af0ff, 0 0 20px 6px #3af0ff88, 0 0 40px 10px #3af0ff33; }
  }

  .login-header .icon-circle {
    width: 72px;
    height: 72px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    border: 2px solid rgba(255,255,255,0.3);
  }

  .login-header .icon-circle svg {
    width: 36px;
    height: 36px;
    fill: white;
  }

  .login-header h2 {
    margin: 0 0 4px;
    font-weight: 700;
    font-size: 1.45rem;
    letter-spacing: 0.3px;
  }

  .login-header p {
    margin: 0;
    font-size: 0.88rem;
    opacity: 0.8;
  }

  .login-body {
    padding: 32px 30px 28px;
    background: #fff;
    border-radius: 0 0 20px 20px;
    position: relative;
    z-index: 1;
  }

  .field-group {
    margin-bottom: 20px;
  }

  .field-group label {
    display: block;
    font-weight: 600;
    font-size: 0.88rem;
    color: #2c3e50;
    margin-bottom: 7px;
  }

  .field-group label span { color: #e74c3c; margin-left: 2px; }

  .input-wrap { position: relative; }

  .input-wrap svg {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    fill: #95a5a6;
    pointer-events: none;
    transition: fill 0.3s;
  }

  .input-wrap input {
    width: 100%;
    padding: 11px 15px 11px 40px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.95rem;
    color: #2c3e50;
    background: #fff;
    box-sizing: border-box;
    transition: border-color 0.3s, box-shadow 0.3s;
    outline: none;
  }

  .input-wrap input:focus {
    border-color: #3498db;
    box-shadow: 0 0 0 0.2rem rgba(52,152,219,0.2);
  }

  .input-wrap input:focus ~ svg { fill: #3498db; }

  .toggle-pass {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    display: flex;
    align-items: center;
  }

  .toggle-pass svg {
    position: static;
    transform: none;
    width: 18px;
    height: 18px;
    fill: #95a5a6;
  }

  .forgot-link {
    display: block;
    text-align: right;
    margin-top: 6px;
    font-size: 0.82rem;
    color: #3498db;
    text-decoration: none;
    font-weight: 600;
  }

  .forgot-link:hover { text-decoration: underline; }

  .btn-login {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #27ae60 0%, #219a52 100%);
    color: white;
    border: none;
    border-radius: 25px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.4px;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(39,174,96,0.3);
  }

  .btn-login:active { transform: translateY(0); }

  .login-footer {
    padding: 0 30px 24px;
    text-align: center;
    background: #fff;
    border-radius: 0 0 20px 20px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .divider hr { flex: 1; border: none; border-top: 1px solid #e0e0e0; }
  .divider span { font-size: 0.78rem; color: #b0b0b0; white-space: nowrap; }

  .system-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f0f7ff;
    border: 1px solid #d0e8f8;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 0.78rem;
    color: #2980b9;
    font-weight: 600;
  }

  .system-badge svg { width: 13px; height: 13px; fill: #3498db; }

  .error-msg {
    background: #fdf0f0;
    border: 1px solid #f5c6c6;
    border-radius: 8px;
    color: #c0392b;
    font-size: 0.83rem;
    padding: 9px 13px;
    margin-bottom: 16px;
    display: none;
    align-items: center;
    gap: 8px;
  }

  .error-msg.show { display: flex; }
  .error-msg svg { width: 15px; height: 15px; fill: #c0392b; flex-shrink: 0; }
</style>

<div class="login-page">
  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-header">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24"><path d="M12 2C9.243 2 7 4.243 7 7s2.243 5 5 5 5-2.243 5-5-2.243-5-5-5zm0 8c-1.654 0-3-1.346-3-3s1.346-3 3-3 3 1.346 3 3-1.346 3-3 3zm9 11v-1c0-3.859-3.141-7-7-7h-4c-3.86 0-7 3.141-7 7v1h2v-1c0-2.757 2.243-5 5-5h4c2.757 0 5 2.243 5 5v1h2z"/></svg>
        </div>
        <h2>Portal do Médico</h2>
        <p>Sistema de Gerenciamento de Atendimentos</p>
      </div>

      <div class="login-body">
        <div class="error-msg" id="errorMsg">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <span id="errorText">CRM ou senha inválidos. Tente novamente.</span>
        </div>

        <div class="field-group">
          <label for="crm">CRM<span>*</span></label>
          <div class="input-wrap">
            <input type="text" id="crm" placeholder="Ex: SP-123456" maxlength="12" />
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
          </div>
        </div>

        <div class="field-group">
          <label for="senha">Senha<span>*</span></label>
          <div class="input-wrap">
            <input type="password" id="senha" placeholder="Digite sua senha" />
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <button class="toggle-pass" onclick="toggleSenha()" type="button">
              <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
          <a href="#" class="forgot-link">Esqueci minha senha</a>
        </div>

        <button class="btn-login" onclick="handleLogin()">Entrar</button>
      </div>

      <div class="login-footer">
        <div class="divider"><hr><span>sistema seguro</span><hr></div>
        <div class="system-badge">
          <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
          Acesso restrito a profissionais de saúde
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  function toggleSenha() {
    const input = document.getElementById('senha');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = '<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>';
    } else {
      input.type = 'password';
      icon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
    }
  }

  function handleLogin() {
    const crm = document.getElementById('crm').value.trim();
    const senha = document.getElementById('senha').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const errorText = document.getElementById('errorText');
    if (!crm || !senha) {
      errorText.textContent = 'Preencha o CRM e a senha para continuar.';
      errorMsg.classList.add('show');
      return;
    }
    errorMsg.classList.remove('show');
    alert('Login enviado! (conecte ao backend Laravel para autenticação real)');
  }
</script>
