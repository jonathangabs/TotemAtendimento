<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Chamada - Hospital Vida</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
    --primary-color: #2c3e50;
    --secondary-color: #3498db;
    --highlight-color: #27ae60;
}

body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    margin: 0;
    color: white;
    font-family: 'Segoe UI', sans-serif;
}

/* Layout principal */
.main-container {
    display: flex;
    height: 100vh;
}

/* Área principal */
.display-area {
    flex: 3;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Sidebar */
.sidebar {
    flex: 1;
    background: rgba(0,0,0,0.2);
    padding: 30px;
}

/* Card principal */
.call-card {
    background: rgba(0,0,0,0.3);
    border-radius: 20px;
    padding: 50px;
    text-align: center;
    width: 90%;
}

/* Destaque */
.senha {
    font-size: 120px;
    font-weight: bold;
    color: #f1c40f;
    animation: pulse 1.5s infinite;
}

.nome {
    font-size: 50px;
    margin-top: 20px;
}

.consultorio {
    font-size: 60px;
    margin-top: 20px;
    color: var(--highlight-color);
}

/* Sidebar */
.sidebar h3 {
    text-align: center;
    margin-bottom: 30px;
}

.proxima {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    text-align: center;
}

.proxima span {
    display: block;
}

.proxima .senha-small {
    font-size: 40px;
    font-weight: bold;
}

.titulo {
    font-size: 60px;
    font-weight: bold;
    margin-bottom: 1.5vw;
    letter-spacing: 2px;
    opacity: 0.9;
}


/* Animação */
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="main-container">

    <!-- Área principal -->

    <div class="display-area">

        <div class="call-card">
            <h1 class="titulo">PAINEL DE CHAMADA</h1>
            <div class="senha">A123</div>
            <div class="nome">João da Silva</div>
            <div class="consultorio">Consultório 05</div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>PRÓXIMAS SENHAS</h3>

        <div class="proxima">
            <span class="senha-small">A124</span>
            <span>Maria Oliveira</span>
        </div>

        <div class="proxima">
            <span class="senha-small">A125</span>
            <span>Carlos Souza</span>
        </div>

        <div class="proxima">
            <span class="senha-small">A126</span>
            <span>Ana Pereira</span>
        </div>

    </div>

</div>

</body>
</html>
